# Liste des Cloud Builders : https://console.cloud.google.com/gcr/images/cloud-builders/GLOBAL
steps:
  # 1. Construction de l'image Docker
  - name: "gcr.io/cloud-builders/docker"
    id: BUILD
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA', '.']

  # 2. Push de l'image sur Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: PUSH
    args: ['push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA']

  # 2b. Tag latest
  - name: 'gcr.io/cloud-builders/docker'
    id: TAG_LATEST
    args: ['tag', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest']
    waitFor: ["PUSH"]

  # 2c. Push latest
  - name: 'gcr.io/cloud-builders/docker'
    id: PUSH_LATEST
    args: ['push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest']
    waitFor: ["TAG_LATEST"]

  # 3. Génération du fichier K8s avec le bon tag
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Rendering templated K8s YAML file
    entrypoint: /bin/sh
    args:
    - '-c'
    - |
       sed -s '$a---' k8s/*.yaml > config.yaml.tpl &&
       sed "s/DOCKER_TAG/${SHORT_SHA}/g" config.yaml.tpl > config.yaml
    waitFor: ["PUSH_LATEST"]

  # 4. Déploiement sur Kubernetes
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: DEPLOY
    entrypoint: /bin/sh
    args:
    - '-c'
    - |
      gcloud container clusters get-credentials $_CLUSTER_NAME --zone $_ZONE --project $PROJECT_ID &&
      kubectl apply -f config.yaml --namespace api-purchase
    waitFor: ["Rendering templated K8s YAML file"]

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'
