# Liste des Cloud Builders : https://console.cloud.google.com/gcr/images/cloud-builders/GLOBAL
steps:
  # 1. Construction de l'image Docker
  - name: "gcr.io/cloud-builders/docker"
    id: BUILD
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/purchase-predict-api:$SHORT_SHA', '.']

  # 2. Push de l'image sur Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: PUSH
    args: ['push', 'gcr.io/$PROJECT_ID/purchase-predict-api:$SHORT_SHA']

  # 3. Déploiement sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: DEPLOY
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'purchase-predict-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/purchase-predict-api:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--vpc-connector'
      - 'main-vpc-connector'
      - '--vpc-egress'
      - 'all-traffic'
      
      - '--clear-network-interfaces'

# Correctif pour l'échec de build (Option C du message d'erreur précédent)
options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/purchase-predict-api:$SHORT_SHA'