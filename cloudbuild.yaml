# Liste des Cloud Builders : https://console.cloud.google.com/gcr/images/cloud-builders/GLOBAL
steps:
  # 1. Construction de l'image Docker
  - name: "gcr.io/cloud-builders/docker"
    id: BUILD
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA', '.']

  # 2. Push de l'image sur Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: PUSH
    args: ['push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA']

  # 2b. Tag latest
  - name: 'gcr.io/cloud-builders/docker'
    id: TAG_LATEST
    args: ['tag', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest']
    waitFor: ["PUSH"]

  # 2c. Push latest
  - name: 'gcr.io/cloud-builders/docker'
    id: PUSH_LATEST
    args: ['push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest']
    waitFor: ["TAG_LATEST"]

  # 3. Déploiement sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: DEPLOY
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--vpc-connector'
      - '$_VPC_CONNECTOR'
      - '--vpc-egress'
      - 'all-traffic'
      - '--update-env-vars'
      - 'ENV=staging,MLFLOW_REGISTRY_NAME=$_MLFLOW_REGISTRY_NAME'
    waitFor: ["PUSH_LATEST"]

options:
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true

images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'
